name: 问题反馈
description: 报告一个可以复现的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈问题。请尽量提供完整的复现信息。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请清晰描述实际行为和预期行为。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请提供最小复现代码或仓库链接。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: z-ui 版本
      placeholder: 例如 0.1.0
    validations:
      required: true
