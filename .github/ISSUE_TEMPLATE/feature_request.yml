name: 功能建议
description: 提议一个新功能或组件改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请说明当前遇到的使用场景或痛点。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请描述你希望 z-ui 如何支持这个需求。
    validations:
      required: true
